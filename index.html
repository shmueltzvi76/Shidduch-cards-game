          { "id": 85, "category": "הפתעה מה-AI", "intro": "יצירתיות ואומנות בבית.", "question": "מה המקום של יצירתיות ואומנות בחיים שלך? ואיך תרצה שזה ייראה בבית?", "options": { "א": "מאוד חשוב — מוזיקה, ציור, כתיבה, יצירה ביד", "ב": "אני צרכן/ית — אוהב/ת להתרשם, לא ליצור", "ג": "לא עוסק/ת בזה — אבל אשמח שבן/בת הזוג כן", "ד": "חשוב בעיקר בשביל הילדים — לפתח להם יצירתיות", "ה": "אחר" }, "target": "both" },
          { "id": 86, "category": "הפתעה מה-AI", "intro": "דמיינו: ילד שלא מתחבר לתורה.", "question": "ילד שאין לו עניין בתורה ובעומק — חי חוויות פיזיות. איך מגדלים אותו?", "options": { "א": "מוצאים מה כן מדליק אותו — כל ילד עמוק בתחום שלו", "ב": "מקבלים — הוא לא חייב להיות כמונו", "ג": "חושפים בעדינות — משלבים עומק בתוך מה שהוא אוהב", "ד": "מחכים — מה שנזרע בילדות צומח בבגרות", "ה": "אחר" }, "target": "both" },
          { "id": 87, "category": "הפתעה מה-AI", "intro": "דמיינו: מישהו מציע לכם עסקה כלכלית מפתה אבל מפוקפקת.", "question": "מציעים לכם עסקה כלכלית שנראית מצוינת — אבל משהו מרגיש לא בסדר. מה עושים?", "options": { "א": "הולכים לפי תחושת הבטן — אם משהו מסריח, לא נוגעים", "ב": "בודקים לעומק — עובדות קודם, תחושות אח\"כ", "ג": "מתייעצים עם רב — גם עסקים צריכים דעת תורה", "ד": "אם שניהם לא בטוחים — לא נכנסים", "ה": "אחר" }, "target": "both" },
          { "id": 88, "category": "שאלות סיום", "intro": "שקיפות מלאה.", "question": "יש לך הרגלים או דברים שהיית רוצה לשתף לפני הנישואין?", "options": { "א": "כן — מוכן/ה לדבר על זה", "ב": "כן — אבל עובד/ת על לשנות", "ג": "לא משהו רציני", "ד": "מעדיף/ה שנגלה ביחד", "ה": "אחר" }, "target": "both" },
          { "id": 89, "category": "שאלות סיום", "intro": "הדבר הכי חשוב.", "question": "מה הדבר האחד שהכי חשוב לך שבן/בת הזוג ידע/תדע עליך — לפני שמתחתנים?", "options": { "א": "יש לי דבר מסוים — ואשמח לשתף עכשיו", "ב": "אני ספר פתוח — רוצה שידעו הכל", "ג": "מודע/ת לכמה דברים — קשה לבחור אחד", "ד": "זה משהו שיתגלה עם הזמן — לא מפחד/ת", "ה": "אחר" }, "target": "both" },
          { "id": 90, "category": "שאלות סיום", "intro": "משפטים פנימיים שמנהלים אותנו.", "question": "יש לך משפטים שמנהלים אותך — לטוב ולמוטב — שאת/ה עובד/ת לשנות?", "options": { "א": "כן — ואני יודע/ת מה הם", "ב": "כן — עדיין בתהליך של לזהות", "ג": "כולנו מונהלים ממשפטים — אבל לא תמיד מודעים", "ד": "לא בטוח/ה — אולי בן/בת הזוג יעזור/תעזור", "ה": "אחר" }, "target": "both" },
          { "id": 91, "category": "שאלות סיום", "intro": "השאלה האחרונה.", "question": "משפט אחד שמסכם את מי שאת/ה — מה הוא?", "options": { "א": "יש לי משפט כזה — ואני חי/ה לפיו", "ב": "קשה לתמצת את עצמי במשפט אחד", "ג": "המשפט שלי משתנה — תלוי בתקופה", "ד": "אני מעדיף/ה שאחרים יגדירו אותי", "ה": "אחר" }, "target": "both" }
        ];

        const TARGET_MAP = { shmuel: 'me', ahinoam: 'her', both: 'both' };

        const QUESTIONS = (() => {
          const map = {};
          QUESTIONS_DATA.forEach(q => {
            map[q.id] = {
              category: q.category,
              intro: q.intro,
              question: q.question,
              options: q.options,
              target: TARGET_MAP[q.target] || 'both'
            };
          });
          return map;
        })();

        const XIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        const ResetIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        );

        function App() {
          const [state, setState] = useState({
            turn: 'her',
            currentCatIdx: 0,
            drawnNumbers: [],
            currentNumber: '?',
            hasStarted: false
          });

          const [tempNum, setTempNum] = useState('?');
          const [isRolling, setIsRolling] = useState(false);
          const [popup, setPopup] = useState(null);
          const [pendingCatTransition, setPendingCatTransition] = useState(null);
          const [isLoaded, setIsLoaded] = useState(false);

          const stateRef = useRef(state);
          const audioCtxRef = useRef(null);

          useEffect(() => {
            try {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
              }
            } catch (e) {}
          }, []);

          useEffect(() => {
            try {
              const saved = localStorage.getItem('shidduchGame_Final');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.turn === 'ahinoam') parsed.turn = 'her';
                else if (parsed.turn === 'shmuel') parsed.turn = 'me';
                setState(parsed);
                setTempNum(parsed.currentNumber || '?');
              }
            } catch (e) {}
            setIsLoaded(true);
          }, []);

          useEffect(() => {
            if (isLoaded) {
              stateRef.current = state;
              try { localStorage.setItem('shidduchGame_Final', JSON.stringify(state)); } catch (e) {}
            }
          }, [state, isLoaded]);

          const initAudio = useCallback(() => {
            try {
              if (!audioCtxRef.current) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtxRef.current = new AudioContextClass();
              }
              if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                audioCtxRef.current.resume();
              }
            } catch (e) {}
          }, []);

          const playSound = useCallback((type) => {
            try {
              initAudio();
              const ctx = audioCtxRef.current;
              if (!ctx) return;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);

              if (type === 'tick') {
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.05);
              } else if (type === 'chime') {
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.setValueAtTime(900, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.6);
              } else if (type === 'open') {
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.001, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.14, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.35);
              } else if (type === 'close') {
                osc.frequency.setValueAtTime(520, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
              }
            } catch (e) {}
          }, [initAudio]);

          const triggerVibration = useCallback((pattern) => {
            try {
              if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(pattern);
              }
            } catch (e) {}
          }, []);

          const startRoll = useCallback(() => {
            setIsRolling(true);
            initAudio();
            
            const { currentCatIdx, drawnNumbers } = stateRef.current;
            const cat = CATEGORIES[currentCatIdx];
            
            if (!cat) {
              setIsRolling(false);
              return;
            }
            
            const remainingNums = cat.ids.filter(n => !drawnNumbers.includes(n));

            if (remainingNums.length === 0) {
              setIsRolling(false);
              return;
            }

            const isLastNum = remainingNums.length === 1;
            const animationPool = isLastNum ? cat.ids : remainingNums;
            const finalResult = remainingNums[Math.floor(Math.random() * remainingNums.length)];

            let ticks = 0;
            const maxTicks = 35; 
            let delay = 30;

            const animateTick = () => {
              ticks++;
              const randomNumFromPool = animationPool[Math.floor(Math.random() * animationPool.length)];
              setTempNum(randomNumFromPool);
              
              playSound('tick');
              triggerVibration(20);

              if (ticks < maxTicks) {
                if (ticks > maxTicks * 0.6) delay += 15;
                setTimeout(animateTick, delay);
              } else {
                finalizeRoll(finalResult, isLastNum);
              }
            };
            
            setTimeout(animateTick, delay);
          }, [initAudio, playSound, triggerVibration]);

          const openQuestionPopup = (number, opts) => {
            const q = QUESTIONS[number] || {
              category: '',
              intro: '',
              question: `שאלה מספר ${number}`,
              options: { א: '', ב: '', ג: '', ד: '', ה: '' }
            };
            playSound('open');
            triggerVibration(15);
            setPopup({
              type: 'question',
              number,
              category: q.category,
              intro: q.intro,
              question: q.question,
              options: q.options,
              ...opts
            });
          };

          const finalizeRoll = (finalNum, isLastNum) => {
            playSound('chime');
            triggerVibration([100, 50, 100]);
            setTempNum(finalNum);

            const { currentCatIdx, turn: rollingPlayer } = stateRef.current;

            setState(prev => {
              const nextTurn = prev.turn === 'her' ? 'me' : 'her';
              const newDrawn = [...prev.drawnNumbers, finalNum];
              return {
                ...prev,
                drawnNumbers: newDrawn,
                turn: nextTurn,
                currentNumber: finalNum
              };
            });

            setPendingCatTransition(isLastNum ? currentCatIdx : null);
            setIsRolling(false);

            setTimeout(() => {
              openQuestionPopup(finalNum, { rollingPlayer });
            }, 600);
          };

          const closeQuestionPopup = () => {
            if (!popup || popup.type !== 'question') return;
            const wasReopened = !!popup.reopened;
            playSound('close');
            triggerVibration(15);
            setPopup(null);
            if (!wasReopened && pendingCatTransition !== null) {
              const finishedCatIdx = pendingCatTransition;
              setPendingCatTransition(null);
              if (finishedCatIdx + 1 < CATEGORIES.length) {
                setPopup({ type: 'cat_transition', prev: finishedCatIdx, next: finishedCatIdx + 1 });
                setState(s => ({ ...s, currentCatIdx: finishedCatIdx + 1 }));
              } else {
                setPopup({ type: 'end' });
              }
            }
          };

          const handleNumberClick = () => {
            if (isRolling || popup || !isLoaded || state.currentNumber === '?') return;
            openQuestionPopup(state.currentNumber, { reopened: true });
          };

          const handlePlayerClick = (player) => {
            if (state.turn !== player || isRolling || popup || !isLoaded) return;
            initAudio();
            if (!state.hasStarted) {
              setPopup({ type: 'start' });
              return;
            }
            startRoll();
          };

          const handleReset = () => {
            try { localStorage.removeItem('shidduchGame_Final'); } catch(e){}
            setState({
              turn: 'her',
              currentCatIdx: 0,
              drawnNumbers: [],
              currentNumber: '?',
              hasStarted: false
            });
            setTempNum('?');
            setPopup(null);
            setPendingCatTransition(null);
          };

          const PopupOverlay = () => {
            const [timeLeft, setTimeLeft] = useState(5);
            const swipeRef = useRef({ x: 0, y: 0, active: false });

            const handleSwipeStart = useCallback((e) => {
              swipeRef.current = { x: e.clientX, y: e.clientY, active: true };
            }, []);

            const handleSwipeEnd = useCallback((e) => {
              if (!swipeRef.current.active) return;
              swipeRef.current.active = false;
              const dx = e.clientX - swipeRef.current.x;
              const dy = e.clientY - swipeRef.current.y;
              if (Math.hypot(dx, dy) > 45) {
                closeQuestionPopup();
              }
            }, []);

            const handleSwipeCancel = useCallback(() => {
              swipeRef.current.active = false;
            }, []);

            const closePopup = useCallback(() => {
              if (!popup) return;
              const type = popup.type;
              setPopup(null);
              if (type === 'start') {
                setState(s => ({ ...s, hasStarted: true }));
                setTimeout(startRoll, 300);
              }
            }, [popup]);

            useEffect(() => {
              if (!popup || popup.type === 'end' || popup.type === 'reset' || popup.type === 'question') return;
              setTimeLeft(5);
              const interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
              return () => clearInterval(interval);
            }, [popup]);

            useEffect(() => {
              if (popup && (popup.type === 'start' || popup.type === 'cat_transition') && timeLeft <= 0) {
                closePopup();
              }
            }, [timeLeft, popup, closePopup]);

            if (!popup) return null;

            if (popup.type === 'question') {
              const optionEntries = popup.options ? Object.entries(popup.options) : [];
              return (
                <div
                  className="absolute inset-0 z-[100] bg-white flex flex-col overflow-hidden fullscreen-popup-anim touch-none"
                  dir="rtl"
                  style={{ touchAction: 'none' }}
                  onPointerDown={handleSwipeStart}
                  onPointerUp={handleSwipeEnd}
                  onPointerCancel={handleSwipeCancel}
                >
                  <div className="flex justify-between items-center px-5 py-3 border-b border-slate-100 shrink-0">
                    <span className="text-xs font-bold text-blue-500">שאלה מספר {popup.number} · {popup.category}</span>
                    <button onClick={closeQuestionPopup} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 shrink-0">
                      <XIcon />
                    </button>
                  </div>
                  <div className="flex-1 min-h-0 px-5 py-3 flex flex-col justify-center gap-2.5">
                    {popup.intro && <p className="text-xs text-slate-400 font-medium leading-snug">{popup.intro}</p>}
                    <h3 className="text-lg font-black text-slate-800 leading-snug">{popup.question}</h3>
                    <div className="flex flex-col gap-1.5 mt-1">
                      {optionEntries.map(([letter, text]) => (
                        <div
                          key={letter}
                          className="w-full py-1.5 px-3 bg-blue-50 rounded-xl text-sm font-bold text-blue-900 border-2 border-blue-100 text-right leading-snug"
                        >
                          {letter}. {text}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              );
            }

            let content = {};
            if (popup.type === 'start') {
              const cat = CATEGORIES[0];
              const count = cat.ids.length;
              content = {
                title: "מתחילים במשחק!",
                text: "הקטגוריה הראשונה:",
                subtext: `"${cat.name}" (${count} שאלות)`,
                note: "השאלות נועדו לפתוח נושאי שיחה — התעניינו ושאלו מעבר למה שכתוב, והתאימו את הניסוח אליכם 🙂"
              };
            } else if (popup.type === 'cat_transition') {
              const prevCat = CATEGORIES[popup.prev];
              const nextCat = CATEGORIES[popup.next];
              const prevCount = prevCat ? prevCat.ids.length : 0;
              const nextCount = nextCat ? nextCat.ids.length : 0;
              content = { title: "מעולה, סיימנו את החלק!", text: prevCat ? `סיימנו את: "${prevCat.name}" (${prevCount} שאלות)` : '', subtext: nextCat ? `הבא בתור: "${nextCat.name}" (${nextCount} שאלות)` : '' };
            } else if (popup.type === 'end') {
              content = { title: "סיימנו!", text: "עניתם על כל השאלות במשחק.", subtext: "כל הכבוד על השיח הפתוח!" };
            } else if (popup.type === 'reset') {
              content = { title: "איפוס משחק", text: "האם לאפס את ההתקדמות ולהתחיל מחדש?" };
            }

            const showTimer = popup.type === 'start' || popup.type === 'cat_transition';

            return (
              <div className="absolute inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-6" dir="rtl">
                <div className="bg-white rounded-[2rem] p-8 w-[90%] max-w-[450px] shadow-2xl text-center relative border-4 border-blue-100 popup-anim">
                  {popup.type !== 'reset' && (
                    <button onClick={closePopup} className="absolute top-4 right-4 p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200">
                      <XIcon />
                    </button>
                  )}
                  
                  <div className="mt-2 mb-6">
                    <h3 className="text-3xl font-black text-slate-800 mb-3">{content.title}</h3>
                    <p className="text-xl text-slate-600 leading-tight">{content.text}</p>
                    {content.subtext && <p className="text-2xl font-bold text-blue-600 mt-3">{content.subtext}</p>}
                    {content.note && <p className="text-sm text-slate-400 leading-snug mt-4 border-t border-slate-100 pt-3">{content.note}</p>}
                  </div>

                  {showTimer && (
                    <div className="mt-6">
                      <div className="w-full bg-slate-100 rounded-full h-3 mb-2 overflow-hidden relative">
                        <div className="bg-blue-500 h-full transition-all duration-1000 ease-linear" style={{ width: `${(Math.max(0, timeLeft) / 5) * 100}%` }} />
                      </div>
                      <p className="text-base text-slate-400 font-medium">נסגר בעוד {Math.max(0, timeLeft)} שניות...</p>
                    </div>
                  )}

                  {popup.type === 'reset' && (
                    <div className="flex gap-4 justify-center mt-8">
                      <button className="px-8 py-3 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-bold text-xl shadow-md" onClick={handleReset}>כן, אפס</button>
                      <button className="px-8 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-2xl font-bold text-xl" onClick={() => setPopup(null)}>ביטול</button>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          const PlayerButton = ({ id, name, textRotationClass }) => {
            const isTurn = state.turn === id;
            if (!isTurn) {
              return (
                <button disabled className="w-full h-full rounded-[2rem] bg-slate-200/70 text-slate-400 text-3xl font-bold border-2 border-slate-300 shadow-inner flex items-center justify-center transition-all">
                  <span className={textRotationClass}>{name}</span>
                </button>
              );
            }
            return (
              <div className="active-turn-wrapper w-full h-full shadow-2xl cursor-pointer" onClick={() => handlePlayerClick(id)}>
                <div className="active-turn-inner w-full h-full flex items-center justify-center text-4xl font-black text-blue-900 bg-white shadow-sm">
                   <span className={textRotationClass}>{name}</span>
                </div>
              </div>
            );
          };

          if (!isLoaded) return <div className="fixed inset-0 bg-slate-100"></div>;

          const cat = CATEGORIES[state.currentCatIdx];
          const totalInCat = cat ? cat.ids.length : 0;
          const drawnInCat = cat ? state.drawnNumbers.filter(n => cat.ids.includes(n)).length : 0;
          const remainingInCat = totalInCat - drawnInCat;

          return (
            <div className="fixed inset-0 overflow-hidden flex items-center justify-center" onPointerDown={initAudio}>
              <div
                className="game-rotator absolute bg-gradient-to-br from-indigo-50 via-sky-50 to-rose-50 flex flex-row p-6 gap-6"
                dir="rtl"
              >

                <div className="w-[120px] shrink-0 h-full">
                  <PlayerButton id="her" name="תורך" textRotationClass="turn-label-her whitespace-nowrap block" />
                </div>

                <div className="flex-1 h-full flex flex-col justify-center items-center gap-4 relative">
                  
                  <div className="w-full flex justify-start mb-[-4px]">
                     <button onClick={() => setPopup({type: 'reset'})} className="p-3 bg-white/70 backdrop-blur rounded-full text-slate-400 hover:text-red-500 shadow-sm border border-slate-200 transition-colors">
                        <ResetIcon />
                     </button>
                  </div>

                  <div className="w-full bg-white/70 backdrop-blur-md py-3 rounded-[1.5rem] shadow-sm border border-white flex justify-center items-center">
                     <h1 className="text-xl font-bold text-slate-700 tracking-wide">משחק לשידוכים</h1>
                  </div>

                  <div
                    onClick={handleNumberClick}
                    className={`flex-1 w-full bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-xl border-4 flex items-center justify-center transition-all duration-300 ${isRolling ? 'border-pink-300 scale-[1.02]' : 'border-blue-200'} ${!isRolling && !popup && state.currentNumber !== '?' ? 'cursor-pointer active:scale-[0.98]' : ''}`}
                  >
                    <span className={`text-[7rem] leading-none font-black ${isRolling ? 'text-blue-500 animate-pulse' : 'text-slate-800'}`}>
                      {tempNum}
                    </span>
                  </div>

                  <div className="w-full bg-white/70 backdrop-blur-md py-3 px-2 rounded-[1.5rem] shadow-sm border border-blue-100 flex flex-col justify-center items-center">
                    <h2 className="text-xl font-black text-blue-900 text-center">
                      {cat ? cat.name : 'סיום משחק'}
                    </h2>
                    {cat && (
                      <p className="text-sm font-bold text-slate-500 mt-1">
                        {remainingInCat > 0 ? `נשארו ${remainingInCat} שאלות בקטגוריה` : 'הקטגוריה הסתיימה'}
                      </p>
                    )}
                  </div>

                </div>

                <div className="w-[120px] shrink-0 h-full">
                  <PlayerButton id="me" name="תורי" textRotationClass="turn-label-me whitespace-nowrap block" />
                </div>

                <PopupOverlay />

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
